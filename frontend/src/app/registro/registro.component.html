<html>
  <body>
    
    <div class="main d-flex align-items-center justify-content-center" id="contenedor">
      <div class="form-container text-center">
        <form class="form">
          <img src="logo2.png" alt="Logo" class="logo-form mb-4"  />
          <h2>Formulario de Registro</h2>
    
          <div class="form-row">
            <div class="form-group text-start">
              <label for="nombre">Nombre</label>
              <input type="text" class="form-control" id="nombre" required />
            </div>
            <div class="form-group text-start">
              <label for="apellido">Apellido</label>
              <input type="text" class="form-control" id="apellido" required />
            </div>
          </div>
    
          <div class="form-row">
            <div class="form-group text-start">
              <label for="fechaNacimiento">Fecha de nacimiento</label>
              <input type="date" class="form-control bg-dark text-white" id="fechaNacimiento" required />
            </div>
            <div class="form-group text-start">
              <label for="fotoPerfil">Foto de perfil</label>
              <input type="file" class="form-control bg-dark text-white" id="fotoPerfil" required />
            </div>
          </div>
    
          <div class="form-row">
            <div class="form-group text-start">
              <label for="usuario">Usuario</label>
              <input type="text" class="form-control" id="usuario" required />
            </div>
            <div class="form-group text-start">
              <label for="email">Email</label>
              <input type="email" class="form-control" id="email" required />
              <small id="emailHelp" class="form-text text-muted"></small>
            </div>
          </div>
    
         <div class="form-row">
          <div class="form-group text-start" style="position: relative;">
            <label for="password">Contraseña 
              <span class="password" (click)="togglePassword()" style="cursor: pointer; position: absolute; right: 10px; top: 35px;">
                <img *ngIf="!passwordVisible" src="/nover.png" alt="Mostrar contraseña" style="width: 20px; height: 20px;" />
                <img *ngIf="passwordVisible" src="/ver.png" alt="Ocultar contraseña" style="width: 20px; height: 20px;" />
              </span>
            </label>
            <input [type]="passwordVisible ? 'text' : 'password'" class="form-control" id="password" required />
          </div>

          <div class="form-group text-start" style="position: relative;">
            <label for="repetirPassword">Repetir contraseña</label>
            <input [type]="passwordVisible ? 'text' : 'password'" class="form-control" id="repetirPassword" required />
            <span class="password-toggle" (click)="togglePassword()" style="cursor: pointer; position: absolute; right: 10px; top: 35px;">
              <img *ngIf="!passwordVisible" src="/nover.png" alt="Mostrar contraseña" style="width: 20px; height: 20px;" />
              <img *ngIf="passwordVisible" src="/ver.png" alt="Ocultar contraseña" style="width: 20px; height: 20px;" />
            </span>
          </div>
        </div>


    
          <div class="form-group text-start">
            <label for="descripcion">Descripción breve</label>
            <textarea class="form-control bg-dark text-white" id="descripcion" rows="3" placeholder="Contanos algo sobre vos..." required></textarea>
          </div>
          
          <a href="/login" class="text-primary fw-bold text-decoration-none text-start d-block">
            ¿Ya tienes cuenta? ¡ Inicia sesión !
          </a>

          <button type="button" class="btn btn-outline-primary mt-3" (click)="registrarUsuario()">Registrarse</button>
    
          
          <div #modalContainer class="mt-3">
          </div>
        </form>
      </div>
    </div>
  </body>
</html>
