<div class ="main d-flex align-items-center justify-content-center" id="contenedor">
  <div class="form-container ">
      <form class="form ">
        <h2>Inicio de sesion</h2>
        
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" class="form-control" id="email" placeholder="" required />
        </div>
    
        <div class="form-group">
          <label for="password">Contraseña</label>
          <input type="password" class="form-control" id="password" placeholder="" required />
        </div>

        <a href="/registro" class="text-primary fw-bold text-decoration-none">
          ¿No tienes cuenta? ¡Regístrate!
        </a>
        

        <button type="button" class="btn btn-outline-success" (click)="login()" >Iniciar Sesion</button>
        <div>
          <p [style.color]="colorMensaje">{{ mensaje }}</p>
        </div>
        
      </form>
    </div>
  </div>
