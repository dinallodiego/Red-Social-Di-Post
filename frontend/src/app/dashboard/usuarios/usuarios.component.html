<div class="container-fluid px-3">
  <h2 class="mt-3 mb-4 text-white text-center">Gestión de Usuarios</h2>

  <!-- Tabla de usuarios -->
  <div class="table-responsive bg-dark rounded shadow-sm p-3">
    <table class="table table-dark table-hover table-bordered align-middle mb-0">
      <thead class="table-danger text-center">
        <tr>
          <th>Nombre</th>
          <th>Apellido</th>
          <th>Usuario</th>
          <th>Email</th>
          <th>Perfil</th>
          <th>Estado</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody *ngIf="usuarios.length > 0; else sinUsuarios">
        <tr *ngFor="let u of usuarios" class="text-center align-middle">
          <td>{{ u.nombre }}</td>
          <td>{{ u.apellido }}</td>
          <td>{{ u.usuario }}</td>
          <td>{{ u.email }}</td>
          <td>
            <span class="badge bg-secondary" *ngIf="u.perfil === 'usuario'">Usuario</span>
            <span class="badge bg-warning text-dark" *ngIf="u.perfil === 'admin'">Admin</span>
          </td>
          <td>
            <span class="badge" [class.bg-success]="u.activo" [class.bg-danger]="!u.activo">
              {{ u.activo ? 'Activo' : 'Inactivo' }}
            </span>
          </td>
          <td>
            <button class="btn btn-sm btn-outline-danger me-1" *ngIf="u.activo" (click)="deshabilitarUsuario(u._id)">
              <i class="bi bi-person-dash"></i> Deshabilitar
            </button>
            <button class="btn btn-sm btn-outline-success" *ngIf="!u.activo" (click)="rehabilitarUsuario(u._id)">
              <i class="bi bi-person-check"></i> Rehabilitar
            </button>
          </td>
        </tr>
      </tbody>
    </table>
    <ng-template #sinUsuarios>
      <tr>
        <td colspan="8" class="text-center text-muted py-4">No hay usuarios registrados.</td>
      </tr>
    </ng-template>
  </div>

  <div class="form-container mt-5 mx-auto">
    <form class="form" novalidate>
      <img src="logo2.png" alt="Logo" class="logo-form mb-3" />
      <h2>Registrar nuevo usuario</h2>

      <div class="form-row">
        <div class="form-group text-start">
          <label for="nombre">Nombre</label>
          <input type="text" class="form-control" id="nombre" [(ngModel)]="nuevoUsuario.nombre" name="nombre" required />
        </div>
        <div class="form-group text-start">
          <label for="apellido">Apellido</label>
          <input type="text" class="form-control" id="apellido" [(ngModel)]="nuevoUsuario.apellido" name="apellido" required />
        </div>
      </div>

      <div class="form-row">
        <div class="form-group text-start">
          <label for="fechaNacimiento">Fecha de nacimiento</label>
          <input type="date" class="form-control bg-dark text-white" id="fechaNacimiento" [(ngModel)]="nuevoUsuario.fechaNacimiento" name="fechaNacimiento" required />
        </div>
        <div class="form-group text-start">
          <label for="fotoPerfil">Foto de perfil</label>
          <input type="file" class="form-control bg-dark text-white" id="fotoPerfil" (change)="onFileSelected($event)" required />
        </div>
      </div>

      <div class="form-row">
        <div class="form-group text-start">
          <label for="usuario">Usuario</label>
          <input type="text" class="form-control" id="usuario" [(ngModel)]="nuevoUsuario.usuario" name="usuario" required />
        </div>
        <div class="form-group text-start">
          <label for="email">Email</label>
          <input type="email" class="form-control" id="email" [(ngModel)]="nuevoUsuario.email" name="email" required />
        </div>
      </div>

      <div class="form-row">
        <div class="form-group text-start position-relative">
          <label for="password">Contraseña</label>
          <input [type]="passwordVisible ? 'text' : 'password'" class="form-control" id="password" [(ngModel)]="nuevoUsuario.password" name="password" required />
          <span class="password-toggle" (click)="togglePassword()">
            <img *ngIf="!passwordVisible" src="/nover.png" />
            <img *ngIf="passwordVisible" src="/ver.png" />
          </span>
        </div>

        <div class="form-group text-start position-relative">
          <label for="repetirPassword">Repetir contraseña</label>
          <input [type]="passwordVisible ? 'text' : 'password'" class="form-control" id="repetirPassword" [(ngModel)]="nuevoUsuario.repetirPassword" name="repetirPassword" required />
          <span class="password-toggle" (click)="togglePassword()">
            <img *ngIf="!passwordVisible" src="/nover.png" />
            <img *ngIf="passwordVisible" src="/ver.png" />
          </span>
        </div>
      </div>

      <div class="form-group text-start">
        <label for="descripcion">Descripción breve</label>
        <textarea class="form-control bg-dark text-white" id="descripcion" [(ngModel)]="nuevoUsuario.descripcion" name="descripcion" rows="3" required></textarea>
      </div>

      <div class="form-group text-start">
        <label for="perfil">Perfil</label>
        <select id="perfil" class="form-control bg-dark text-white" [(ngModel)]="nuevoUsuario.perfil" name="perfil">
          <option value="usuario">Usuario</option>
          <option value="admin">Administrador</option>
        </select>
      </div>

      <a href="/login" class="text-primary fw-bold text-decoration-none d-block mt-2">¿Ya tienes cuenta? ¡Inicia sesión!</a>

      <button type="button" class="btn btn-outline-primary mt-4" (click)="registrarUsuario()">Registrarse</button>

      <div *ngIf="mensaje" class="alert mt-3" [ngClass]="{ 'alert-success': tipoMensaje === 'success', 'alert-danger': tipoMensaje === 'danger' }">
        {{ mensaje }}
      </div>
    </form>
  </div>
</div>
