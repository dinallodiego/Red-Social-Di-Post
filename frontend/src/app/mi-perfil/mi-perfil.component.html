<body class="bg-gradient-custom d-flex align-items-center justify-content-center min-vh-100">
  <div class="card profile-card shadow-lg rounded-4 text-white position-relative w-100 p-3">
    <div class="card-body">
      <p class="username-top m-0 position-absolute" style="color: rgb(65, 65, 65);">{{"@"}}{{user_name}}</p>
      <div class="row align-items-center mt-5 g-5">
        <div class="col-md-4 text-center">
          <img [src]="foto_dePerfilPath" alt="Foto de perfil" class="profile-img-xl">
        </div>
        <div class="col-md-8 ps-md-5">
          <h2 class="mb-3 ms-3 " style="color: rgb(185, 185, 185);">{{nombre}}</h2>
          <p class=" mb-3 ms-3 user-desc " style="color: rgb(185, 185, 185);">
            {{descripcion}}
          </p>
        </div>
      </div>

      <hr class="border-light">

      <div class="posts mt-4">

        <div *ngIf="publicaciones.length === 0" class="text-light">
          No hay publicaciones todavía.
        </div>

        <div *ngFor="let pub of publicaciones" class="card bg-dark text-white my-3 p-3 rounded shadow">
          <h5 class="mb-2">{{ pub.titulo }}</h5>

          <img *ngIf="pub.imagen" 
               [src]="'http://localhost:3000/uploads/publicaciones/' + pub.imagen" 
               class="img-fluid rounded mb-2"
               alt="Imagen de publicación">

          <p>{{ pub.descripcion }}</p>

          <div class="d-flex justify-content-between small align-items-center">
            <span>Publicado: {{ pub.fecha | date:'short' }}</span>

            <div class="like-container">
              <button
                class="like-button"
                [ngClass]="{ liked: pub.likes.includes(user_name) }"
                (click)="darLike(pub._id)"
                aria-label="Me gusta"
              >
              <span class="heart-icon">{{ pub.likes.includes(user_name) ? '❤️' : '🤍' }} </span>
              <span class="like-count">{{ pub.likes.length }}</span>
              </button>
              <span class="btn-comment" (click)="abrirComentarios(pub)">
                <img src="/comment.png" alt="Comentario" style="cursor: pointer; height: 22px;">
              </span>
            </div>
          </div>
          
        </div>
      </div>

    </div>
  </div>

<div class="modal fade show d-block" tabindex="-1" role="dialog" *ngIf="mostrarModalComentarios">
  <div class="modal-dialog" role="document">
    <div class="modal-content text-dark">
      <div class="modal-header">
        <h5 class="modal-title">Comentarios</h5>
        <button type="button" class="btn-close" (click)="cerrarModalComentarios()"></button>
      </div>
      <div class="modal-body">
        <div *ngIf="comentariosActuales.length === 0" class="text-muted">No hay comentarios aún.</div>
        <ul class="list-group mb-3">
          <li *ngFor="let c of comentariosActuales" class="list-group-item">
            <strong>{{"@"}}{{ c.usuario }}</strong>
            <p class="mb-1">{{ c.contenido }}</p>
            <small class="text-muted">{{ c.fecha | date:'short' }}</small>
          </li>
        </ul>

        <textarea [(ngModel)]="comentarioNuevo" class="form-control" rows="3" placeholder="Escribe tu comentario..."></textarea>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" (click)="cerrarModalComentarios()">Cerrar</button>
        <button class="btn btn-primary" (click)="agregarComentario()">Comentar</button>
      </div>
    </div>
  </div>
</div>


<div *ngIf="mostrarModalComentarios" class="modal-backdrop fade show"></div>


  
</body>
