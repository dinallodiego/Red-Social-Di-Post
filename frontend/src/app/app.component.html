<button 
  class="btn btn-dark d-lg-none m-2 position-fixed top-0 start-0 z-1031"
  (click)="toggleSidebar()"
  aria-label="Toggle sidebar"
>
  <i class="bi bi-list fs-3"></i>
</button>


<div class="d-flex">

  
  <nav [class.show]="sidebarVisible" class="sidebar bg-dark text-white d-flex flex-column p-3">

    
    <div class="sidebar-header d-flex align-items-center mb-1 mt-1 text-white text-decoration-none" >
      <h4 class="d-flex align-items-center text-white text-decoration-none w-100 mt-5">
        <img src="/favicon2.png" alt="Di Post" height="40" class="me-2" />
        <span class="fs-4 fw-bold">Di Post</span>
      </h4>
    </div>

    <hr class="text-secondary" />

    
    <div class="sidebar-content flex-grow-1 d-flex flex-column overflow-auto">
      <ul class="nav nav-pills flex-column mb-auto">
        <li class="nav-item mb-1" *ngIf="tokenActivo()">
          <a href="/publicaciones" [ngClass]="{'active-link': isCurrentPage('/publicaciones')}" class="nav-link text-white d-flex align-items-center" (click)="closeSidebarOnMobile()">
            <i class="bi bi-file-post-fill me-2"></i> Publicaciones
          </a>
        </li>
        <li class="nav-item mb-1" *ngIf="tokenActivo()">
          <a href="/mi-perfil" [ngClass]="{'active-link': isCurrentPage('/mi-perfil')}" class="nav-link text-white d-flex align-items-center" (click)="closeSidebarOnMobile()">
            <i class="bi bi-person-circle me-2"></i> Perfil
          </a>
        </li>
        <li class="nav-item mb-1" *ngIf="!tokenActivo()">
          <a href="/login" [ngClass]="{'active-link': isCurrentPage('/login')}" class="nav-link text-white d-flex align-items-center" (click)="closeSidebarOnMobile()">
            <i class="bi bi-box-arrow-in-right me-2"></i> Login
          </a>
        </li>
        <li class="nav-item mb-1" *ngIf="!tokenActivo()">
          <a href="/registro" [ngClass]="{'active-link': isCurrentPage('/registro')}" class="nav-link text-white d-flex align-items-center" (click)="closeSidebarOnMobile()">
            <i class="bi bi-person-plus-fill me-2"></i> Registro
          </a>
        </li>
        <li class="nav-item mb-1" *ngIf="tokenActivo()">
          <a (click)="cerrarSesion(); closeSidebarOnMobile()" style="cursor:pointer" class="nav-link text-white d-flex align-items-center">
            <i class="bi bi-box-arrow-right me-2"></i> Cerrar sesión
          </a>
        </li>
      </ul>

      <hr class="text-secondary" />

      <div *ngIf="nombre_usuario && tokenActivo()" class="user-info mt-auto d-flex align-items-center">
        <i class="bi bi-person-circle fs-4 me-2"></i>
        <span>{{ nombre_usuario }}</span>
      </div>
    </div>
  </nav>

  
  <div class="overlay" *ngIf="sidebarVisible" (click)="toggleSidebar()"></div>

  
  <div class="main-content flex-grow-1 p-3" (click)="closeSidebarOnMobile()">
    <router-outlet></router-outlet>
  </div>
</div>
